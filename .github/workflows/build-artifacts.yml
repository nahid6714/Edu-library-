name: Build & Auto-Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Generate Dynamic Version & Tag
        id: vars
        run: |
          BUILD_NUM="${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          else
            TAG="v1.0.${BUILD_NUM}"
            VER="1.0.${BUILD_NUM}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "build_num=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VER}, Tag: ${TAG}, Build: ${BUILD_NUM}"

      - name: Install Dependencies
        run: npm install

      - name: Build Web Dist
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle wrapper --gradle-version 8.13
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" release-assets/EduLibrary-latest.apk
            cp "$APK_FILE" "release-assets/EduLibrary-${{ steps.vars.outputs.tag }}.apk"
          else
            echo "Error: APK not found at $APK_FILE"
            exit 1
          fi

          # Generate updated version.json for this release
          node -e "
            const fs = require('fs');
            const v = '${{ steps.vars.outputs.version }}';
            const tag = '${{ steps.vars.outputs.tag }}';
            const repo = '${{ github.repository }}';
            const info = {
              version: v,
              versionCode: Number('${{ steps.vars.outputs.build_num }}'),
              title: 'Edu Library ' + tag + ' (Official Build #' + '${{ steps.vars.outputs.build_num }}' + ')',
              releaseNotes: 'স্বয়ংক্রিয় এপিকে রিলিজ • Auto-built APK on push • Build #' + '${{ steps.vars.outputs.build_num }}',
              apkDownloadUrl: 'https://github.com/' + repo + '/releases/download/' + tag + '/EduLibrary-latest.apk',
              htmlUrl: 'https://github.com/' + repo + '/releases/tag/' + tag,
              publishedAt: new Date().toISOString()
            };
            fs.writeFileSync('release-assets/version.json', JSON.stringify(info, null, 2));
            fs.writeFileSync('version.json', JSON.stringify(info, null, 2));
          "

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduLibrary-Android-APK-${{ steps.vars.outputs.tag }}
          path: release-assets/EduLibrary-latest.apk
          retention-days: 30

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduLibrary-WebApp-Dist-${{ steps.vars.outputs.tag }}
          path: dist/
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Edu Library ${{ steps.vars.outputs.tag }} (Auto APK Release)
          body: |
            ## 📱 Edu Library - Android App Release (${{ steps.vars.outputs.tag }})
            
            স্বয়ংক্রিয়ভাবে তৈরি হওয়া নতুন অ্যান্ড্রয়েড অ্যাপ রিলিজ (Build #${{ steps.vars.outputs.build_num }}).
            
            ### ⬇️ সরাসরি ডাউনলোড লিংক:
            - **[EduLibrary-latest.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/EduLibrary-latest.apk)**
            - **[EduLibrary-${{ steps.vars.outputs.tag }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/EduLibrary-${{ steps.vars.outputs.tag }}.apk)**
            
            ---
            ### 🛠️ ফোনে ইনস্টল করার নিয়ম:
            1. উপরের লিঙ্কে ক্লিক করে **`EduLibrary-latest.apk`** ডাউনলোড করুন।
            2. ফাইলটিতে ট্যাপ করে **Install** এ চাপুন।
            3. ইনস্টল সম্পন্ন হলে সরাসরি আপনার ফোনে Edu Library অ্যাপটি চালু করুন!
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-assets/EduLibrary-latest.apk
            release-assets/EduLibrary-${{ steps.vars.outputs.tag }}.apk
            release-assets/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


