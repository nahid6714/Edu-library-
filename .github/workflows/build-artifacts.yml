name: Build & Auto-Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Calculate Release Version
        id: vars
        shell: bash
        run: |
          BUILD_NUM="${{ github.run_number }}"
          TAG="v1.0.${BUILD_NUM}"
          VER="1.0.${BUILD_NUM}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "version_code=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "Generated version: ${VER}, tag: ${TAG}, versionCode: ${BUILD_NUM}"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Dist
        env:
          VITE_APP_VERSION: ${{ steps.vars.outputs.version }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: Missing GitHub secret ANDROID_KEYSTORE_BASE64."
            echo "Create one release keystore and store its base64 content in GitHub Secrets before publishing updates."
            exit 1
          fi
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/release.keystore

      - name: Build Signed Release APK
        env:
          APP_VERSION: ${{ steps.vars.outputs.version }}
          APP_VERSION_CODE: ${{ steps.vars.outputs.version_code }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Prepare Release Assets
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
          VERSION_CODE: ${{ steps.vars.outputs.version_code }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p release-assets
          APK_FILE="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "Error: signed release APK not found at $APK_FILE"
            exit 1
          fi

          cp "$APK_FILE" release-assets/EduLibrary-latest.apk
          cp "$APK_FILE" "release-assets/EduLibrary-${RELEASE_TAG}.apk"

          node -e '
            const fs = require("fs");
            const info = {
              version: process.env.RELEASE_VERSION,
              versionCode: Number(process.env.VERSION_CODE),
              title: `Edu Library ${process.env.RELEASE_TAG}`,
              releaseNotes: "নতুন ফিচার, বাগ ফিক্স ও পারফরম্যান্স উন্নতি।",
              apkDownloadUrl: `https://github.com/${process.env.REPOSITORY}/releases/download/${process.env.RELEASE_TAG}/EduLibrary-latest.apk`,
              htmlUrl: `https://github.com/${process.env.REPOSITORY}/releases/tag/${process.env.RELEASE_TAG}`,
              publishedAt: new Date().toISOString()
            };
            fs.writeFileSync("release-assets/version.json", JSON.stringify(info, null, 2));
            const text = JSON.stringify(info, null, 2) + "\n";
            fs.writeFileSync("version.json", text);
            fs.writeFileSync("public/version.json", text);
          '

      - name: Publish version.json to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json public/version.json
          if git diff --cached --quiet; then
            echo "version.json is already up to date."
          else
            git commit -m "chore: update app version metadata [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduLibrary-Android-APK-${{ steps.vars.outputs.tag }}
          path: release-assets/EduLibrary-latest.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Edu Library ${{ steps.vars.outputs.tag }}
          body: |
            ## 📱 Edu Library ${{ steps.vars.outputs.tag }}

            নতুন signed Android APK release.

            **Version:** ${{ steps.vars.outputs.version }}
            **Version Code:** ${{ steps.vars.outputs.version_code }}

            ### APK
            - `EduLibrary-latest.apk` — current release APK
            - `EduLibrary-${{ steps.vars.outputs.tag }}.apk` — versioned copy
            - `version.json` — update metadata
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/EduLibrary-latest.apk
            release-assets/EduLibrary-${{ steps.vars.outputs.tag }}.apk
            release-assets/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
